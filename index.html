<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>CAT ARENA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1d2b3a;--ac:#ffb347;--tx:#fff;--pn:rgba(20,30,45,.88)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
canvas#g{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(15,22,34,.82);z-index:5;text-align:center;padding:16px}
.hide{display:none!important}
h1{font-size:clamp(38px,9vw,72px);margin:0;color:var(--ac);letter-spacing:3px;text-shadow:0 4px 0 #b3541e}
button,.chip{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 26px;background:var(--ac);color:#3a1d05;cursor:pointer;font-size:18px;box-shadow:0 4px 0 #b3541e}
button:active{transform:translateY(3px);box-shadow:none}
button.sec{background:#3b516b;color:#fff;box-shadow:0 4px 0 #22313f}
input[type=text]{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #3b516b;background:#13202e;color:#fff;font-size:17px;text-align:center;width:220px}
input[type=color]{width:56px;height:44px;border:0;background:none;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{padding:7px 12px;font-size:14px;box-shadow:none;background:#3b516b;color:#fff}.chip.on{background:var(--ac);color:#3a1d05}
#hud{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--pn);padding:8px 12px;border-radius:12px;font-size:15px;line-height:1.5;z-index:2;pointer-events:none}
#lb{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--pn);padding:8px 12px;border-radius:12px;font-size:14px;min-width:150px;z-index:2;pointer-events:none}
#lb div{display:flex;justify-content:space-between;gap:10px}#lb .me{color:var(--ac);font-weight:700}
#mm{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:12px;background:var(--pn);z-index:2}
#snd{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:6px}
#snd button{padding:6px 10px;font-size:15px;box-shadow:none}
#dash{position:fixed;right:20px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;z-index:3;font-size:15px;padding:0}
#net{font-size:14px;color:#9fe3a8}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--pn);padding:8px 16px;border-radius:12px;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud" class="hide"></div><div id="lb" class="hide"></div><canvas id="mm" class="hide" width="120" height="120"></canvas>
<div id="snd" class="hide"><button class="sec" id="bm">🎵</button><button class="sec" id="bs">🔊</button></div>
<button id="dash" class="hide">DASH</button><div id="toast"></div>

<div class="ov" id="menu">
 <h1>🐱 CAT ARENA</h1>
 <div>Ăn để lớn · lao vào mèo nhỏ hơn · đừng để mèo to nuốt!</div>
 <input type="text" id="nm" maxlength="12" placeholder="Tên của bạn">
 <div class="row"><button id="play">▶ START GAME</button><button class="sec" id="cust">🎨 CUSTOMIZE CAT</button></div>
 <div class="row"><button class="sec" id="mm1">🎵 Music: ON</button><button class="sec" id="ms1">🔊 SFX: ON</button></div>
 <div id="net">Đang kết nối phòng online…</div>
 <div style="font-size:13px;opacity:.7">Di chuột/chạm để điều hướng · WASD/mũi tên · Space hoặc giữ chuột = lao (DASH)</div>
</div>
<div class="ov hide" id="cz">
 <h1 style="font-size:40px">Chọn mèo</h1>
 <canvas id="pv" width="220" height="200"></canvas>
 <div class="row" id="chips" style="max-width:560px"></div>
 <div class="row">Màu lông: <input type="color" id="col"><button class="sec" id="rc">Màu gốc</button></div>
 <button id="ok">✔ XÁC NHẬN</button>
</div>
<div class="ov hide" id="go">
 <h1 style="font-size:52px;color:#ff6b6b">GAME OVER</h1>
 <div id="gos" style="font-size:20px;line-height:1.7"></div>
 <div class="row"><button id="rs">↻ RESTART</button><button class="sec" id="gm">MAIN MENU</button></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id),cv=$('g'),g=cv.getContext('2d'),mm=$('mm'),mg=mm.getContext('2d');
const W=4200,NF=650,TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const B=[{n:'Mướp',c:'#b98a5a',e:0,p:1},{n:'Cam',c:'#f29a3c',e:0,p:1},{n:'Đen',c:'#2e2e38',e:0,p:0},{n:'Trắng',c:'#f6f3f0',e:2,p:0},{n:'Tam thể',c:'#f6f3f0',e:0,p:2},{n:'Tuxedo',c:'#26262e',e:0,p:3},{n:'Xiêm',c:'#eadcc2',e:3,p:4},{n:'Ba Tư',c:'#d9d4e8',e:1,p:0,f:1},{n:'Anh lông ngắn',c:'#8fa0b5',e:1,p:0,w:1.12},{n:'Bengal',c:'#dba444',e:1,p:5}];
const NAMES=['Miu','Bông','Tom','Mun','Kitty','Lulu','Cốm','Tuna','Nabi','Mochi','Sushi','Bơ','Gấu','Xíu'];
// ---------- audio ----------
let AC=null,sfxOn=true,musOn=true,lastS={},mTimer=null,mStep=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,t='sine',v=.12,sl=0,dl=0){const a=ac();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),s=a.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),s+d);gn.gain.setValueAtTime(v,s);gn.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(gn).connect(a.destination);o.start(s);o.stop(s+d+.02)}
const SFX={spawn:()=>{tone(300,.25,'triangle',.15,500)},step:()=>tone(90,.05,'sine',.04),eat:()=>tone(700+Math.random()*200,.07,'square',.04,300),grow:()=>{tone(500,.12,'triangle',.12,300);tone(800,.15,'triangle',.1,300,.1)},atk:()=>tone(260,.15,'sawtooth',.08,-120),dash:()=>tone(200,.2,'sawtooth',.07,400),hit:()=>tone(120,.12,'square',.1,-60),kill:()=>{tone(400,.1,'square',.12,300);tone(700,.2,'square',.12,400,.08)},loot:()=>tone(900,.06,'triangle',.06,400),score:()=>{tone(660,.1,'triangle',.1);tone(990,.18,'triangle',.1,0,.1)},die:()=>{tone(400,.6,'sawtooth',.15,-340)},click:()=>tone(520,.07,'square',.07),start:()=>{tone(392,.12,'triangle',.12);tone(523,.12,'triangle',.12,0,.12);tone(784,.25,'triangle',.12,0,.24)},restart:()=>tone(440,.15,'triangle',.12,200)};
function sfx(k){if(!sfxOn)return;const n=performance.now(),gap=k==='eat'?55:k==='step'?200:70;if(lastS[k]&&n-lastS[k]<gap)return;lastS[k]=n;SFX[k]()}
function music(){clearInterval(mTimer);if(!musOn||!ac())return;const sc=[262,294,330,392,440,392,330,294],bs=[131,131,175,196];mTimer=setInterval(()=>{if(!musOn)return;tone(sc[mStep%8]*(mStep%16<8?1:1.25),.22,'triangle',.035);if(mStep%4===0)tone(bs[(mStep>>2)%4],.5,'sine',.05);mStep++},260)}
function setSnd(){$('bm').textContent=musOn?'🎵':'🔇';$('bs').textContent=sfxOn?'🔊':'🔈';$('mm1').textContent='🎵 Music: '+(musOn?'ON':'OFF');$('ms1').textContent='🔊 SFX: '+(sfxOn?'ON':'OFF')}
function togM(){musOn=!musOn;setSnd();music();sfx('click')}function togS(){sfxOn=!sfxOn;setSnd();sfx('click')}
$('bm').onclick=$('mm1').onclick=togM;$('bs').onclick=$('ms1').onclick=togS;
// ---------- cat drawing ----------
function shade(c,k){const n=parseInt(c.slice(1),16);let r=n>>16,gg=(n>>8)&255,b=n&255;return`rgb(${clamp(r*k|0,0,255)},${clamp(gg*k|0,0,255)},${clamp(b*k|0,0,255)})`}
function drawCat(c,x,y,r,bi,col,ph,blink){const b=B[bi],w=b.w||1;c.save();c.translate(x,y);
 c.strokeStyle=col;c.lineWidth=r*.28;c.lineCap='round';c.beginPath();c.moveTo(-r*.6,r*.5);c.quadraticCurveTo(-r*1.5,r*.7+Math.sin(ph)*r*.4,-r*1.3,-r*.2+Math.sin(ph)*r*.3);c.stroke();
 c.fillStyle=shade(col,.85);for(const s of[-1,1]){c.beginPath();c.ellipse(s*r*.42+Math.sin(ph)*s*r*.12,r*.92,r*.25,r*.17,0,0,TAU);c.fill()}
 for(const s of[-1,1]){c.fillStyle=col;c.beginPath();
  if(b.e===1)c.arc(s*r*.72*w,-r*.72,r*.33,0,TAU);
  else if(b.e===2){c.moveTo(s*r*.95*w,-r*.3);c.lineTo(s*r*1.0*w,-r*1.0);c.lineTo(s*r*.4,-r*.88)}
  else{const h=b.e===3?1.55:1.2;c.moveTo(s*r*.9*w,-r*.2);c.lineTo(s*r*.7*w,-r*h);c.lineTo(s*r*.2,-r*.85)}
  c.fill();c.fillStyle='#ff9fb0';c.beginPath();c.arc(s*r*.62*w,-r*.78,r*.14,0,TAU);c.fill()}
 c.fillStyle=col;if(b.f)for(let i=0;i<16;i++){const a=i/16*TAU;c.beginPath();c.arc(Math.cos(a)*r*1.0,Math.sin(a)*r*.95,r*.17,0,TAU);c.fill()}
 c.beginPath();c.ellipse(0,0,r*w,r*.95,0,0,TAU);c.fill();
 c.save();c.beginPath();c.ellipse(0,0,r*w,r*.95,0,0,TAU);c.clip();
 const d='rgba(40,25,15,.45)';
 if(b.p===1){c.strokeStyle=d;c.lineWidth=r*.09;for(const o of[-.3,0,.3]){c.beginPath();c.moveTo(o*r,-r*.95);c.lineTo(o*r*.8,-r*.45);c.stroke()}for(const s of[-1,1])for(const o of[.05,.3]){c.beginPath();c.moveTo(s*r*w,o*r);c.lineTo(s*r*.7,o*r+r*.05);c.stroke()}}
 if(b.p===2){c.fillStyle='#f29a3c';c.beginPath();c.arc(-r*.55,-r*.45,r*.5,0,TAU);c.fill();c.fillStyle='#2e2e38';c.beginPath();c.arc(r*.6,-r*.4,r*.45,0,TAU);c.fill();c.beginPath();c.arc(r*.3,r*.8,r*.35,0,TAU);c.fill()}
 if(b.p===3){c.fillStyle='#fff';c.beginPath();c.ellipse(0,r*.6,r*.5,r*.5,0,0,TAU);c.fill();c.beginPath();c.moveTo(0,-r*.2);c.lineTo(-r*.12,r*.2);c.lineTo(r*.12,r*.2);c.fill()}
 if(b.p===4){const gr=c.createRadialGradient(0,r*.2,r*.05,0,r*.2,r*.62);gr.addColorStop(0,'rgba(70,42,28,.9)');gr.addColorStop(1,'rgba(70,42,28,0)');c.fillStyle=gr;c.fillRect(-r,-r,2*r,2*r)}
 if(b.p===5){c.fillStyle='rgba(60,35,15,.7)';for(const[a,bb,s]of[[-.6,-.5,.14],[.5,-.6,.12],[-.7,.2,.13],[.7,.1,.15],[0,-.75,.1],[-.3,.75,.12],[.35,.8,.11]]){c.beginPath();c.arc(a*r,bb*r,s*r,0,TAU);c.fill()}}
 c.restore();
 const ey=blink?.12:1;for(const s of[-1,1]){c.fillStyle='#fff';c.beginPath();c.ellipse(s*r*.38,-r*.12,r*.2,r*.24*ey,0,0,TAU);c.fill();c.fillStyle='#1b1b22';c.beginPath();c.ellipse(s*r*.4,-r*.1,r*.1,r*.18*ey,0,0,TAU);c.fill()}
 c.fillStyle='#ff8fa3';c.beginPath();c.moveTo(-r*.1,r*.15);c.lineTo(r*.1,r*.15);c.lineTo(0,r*.27);c.fill();
 c.strokeStyle='#1b1b22';c.lineWidth=Math.max(1,r*.04);c.beginPath();c.moveTo(0,r*.27);c.quadraticCurveTo(-r*.12,r*.42,-r*.22,r*.36);c.moveTo(0,r*.27);c.quadraticCurveTo(r*.12,r*.42,r*.22,r*.36);c.stroke();
 c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=Math.max(1,r*.03);c.beginPath();for(const s of[-1,1]){c.moveTo(s*r*.3,r*.22);c.lineTo(s*r*.9,r*.12);c.moveTo(s*r*.3,r*.3);c.lineTo(s*r*.9,r*.35)}c.stroke();
 c.restore()}
// ---------- state ----------
const S={mode:'menu',breed:0,col:null,name:'',t:0};
let me=null,bots=[],food=[],drops=[],parts=[],room=null,myPeer=null,peers={},shake=0,keys={},mouse={x:0,y:0,down:false,has:false},cam={x:W/2,y:W/2,z:1},best=0;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
(function(){const r=rng(777);for(let i=0;i<NF;i++)food.push({x:80+r()*(W-160),y:80+r()*(W-160),v:r()<.12?3:1,a:true,t:0,h:r()*360})})();
const rad=m=>12+3.2*Math.sqrt(m);
function mk(bot,name){const bi=Math.random()*10|0;return{x:rnd(300,W-300),y:rnd(300,W-300),m:bot?rnd(10,40):10,ang:rnd(0,TAU),bi:bot?bi:S.breed,col:bot?shade(B[bi].c,rnd(.8,1.1)):(S.col||B[S.breed].c),name,bot,alive:true,kills:0,ph:0,dash:false,ai:{t:0,tx:0,ty:0,flee:false,dsh:false},id:Math.random(),sc:0,bl:0}}
function startGame(){me=mk(false,S.name||'Bạn');me.x=rnd(800,W-800);me.y=rnd(800,W-800);bots=[];for(let i=0;i<7;i++)bots.push(mk(true,NAMES[(Math.random()*NAMES.length)|0]));drops=[];parts=[];food.forEach(f=>f.a=true);cam.x=me.x;cam.y=me.y;S.mode='play';['menu','cz','go'].forEach(i=>$(i).classList.add('hide'));['hud','lb','mm','snd'].forEach(i=>$(i).classList.remove('hide'));if('ontouchstart'in window)$('dash').classList.remove('hide');ac();music();sfx('start');sfx('spawn');pushPres();toast('Ăn hạt để lớn lên! Bạn bè vào cùng link sẽ thấy nhau 🐾')}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,3500)}
// ---------- particles ----------
function burst(x,y,n,col,sp=120){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.7),c:col})}}
function dropFood(x,y,m){const n=Math.min(45,Math.max(4,m/2.2|0));for(let i=0;i<n;i++){const a=rnd(0,TAU),d=rnd(5,rad(m)*1.6);drops.push({x:clamp(x+Math.cos(a)*d,40,W-40),y:clamp(y+Math.sin(a)*d,40,W-40),v:m*.55/n*1.0+.4,h:rnd(0,360),l:60})}}
// ---------- entities ----------
function all(){const a=[me,...bots].filter(e=>e&&e.alive);for(const k in peers){const p=peers[k];if(p.alive)a.push(p)}return a}
function die(e,killer){e.alive=false;burst(e.x,e.y,28,e.col,260);shake=e===me?14:shake;if(e.bot){e.respawn=3}if(e!==me&&!e.bot)return;if(e===me){sfx('die');dropFood(e.x,e.y,e.m);pushPres();setTimeout(gameOver,900,killer)}}
function addMass(e,v){const old=e.m;e.m+=v*1.5/(1+e.m/110);e.sc+=v*8;if(e===me){if(((old/25)|0)!==((e.m/25)|0))sfx('grow')}}
function think(b,dt){const a=b.ai;a.t-=dt;if(a.t>0)return;a.t=rnd(.25,.5);const r=rad(b.m);let thr=null,prey=null,td=520,pd=420;for(const o of all()){if(o===b)continue;const d=Math.hypot(o.x-b.x,o.y-b.y),ro=rad(o.m);if(ro>r*1.15&&d<td){thr=o;td=d}else if(r>ro*1.25&&d<pd){prey=o;pd=d}}
 a.dsh=false;if(thr){a.flee=true;a.tx=b.x-(thr.x-b.x);a.ty=b.y-(thr.y-b.y);a.dsh=td<r*3.5&&b.m>14;return}
 a.flee=false;if(prey){a.tx=prey.x+(prey.vx||0)*.3;a.ty=prey.y+(prey.vy||0)*.3;a.dsh=pd<r*4&&b.m>16;return}
 let bd=700,bf=null;for(const f of food){if(!f.a)continue;const d=Math.abs(f.x-b.x)+Math.abs(f.y-b.y);if(d<bd){bd=d;bf=f}}for(const f of drops){const d=Math.abs(f.x-b.x)+Math.abs(f.y-b.y);if(d<bd){bd=d;bf=f}}
 if(bf){a.tx=bf.x;a.ty=bf.y}else if(Math.hypot(a.tx-b.x,a.ty-b.y)<80||!a.tx){a.tx=rnd(200,W-200);a.ty=rnd(200,W-200)}}
function move(e,dt,ta,dash){let da=ta-e.ang;da=Math.atan2(Math.sin(da),Math.cos(da));e.ang+=clamp(da,-6*dt,6*dt);let sp=215*Math.pow(rad(e.m)/14,-.22);if(dash&&e.m>12){sp*=1.75;e.m-=dt*(1.2+e.m*.012);e.dashing=true;if(e===me&&Math.random()<.08)sfx('dash')}else e.dashing=false;
 e.vx=Math.cos(e.ang)*sp;e.vy=Math.sin(e.ang)*sp;e.x+=e.vx*dt;e.y+=e.vy*dt;const r=rad(e.m);e.x=clamp(e.x,r,W-r);e.y=clamp(e.y,r,W-r);e.ph+=dt*sp/22;if(e.m>30)e.m-=e.m*.0015*dt;e.bl=(Math.random()<.004)?.15:Math.max(0,e.bl-dt)}
function eatStuff(e,bot){const r=rad(e.m);for(let i=0;i<food.length;i++){const f=food[i];if(f.a&&Math.abs(f.x-e.x)<r+8&&Math.abs(f.y-e.y)<r+8&&Math.hypot(f.x-e.x,f.y-e.y)<r+6){f.a=false;f.t=S.t+25;addMass(e,f.v);if(e===me){sfx('eat');burst(f.x,f.y,3,`hsl(${f.h},90%,65%)`,60);emit('eat',i)}}}
 for(let i=drops.length-1;i>=0;i--){const f=drops[i];if(Math.hypot(f.x-e.x,f.y-e.y)<r+8){drops.splice(i,1);addMass(e,f.v);if(e===me)sfx('loot')}}}
function fight(){const list=all();for(const a of list){if(a.peer)continue;for(const b of list){if(a===b)continue;const ra=rad(a.m),rb=rad(b.m),d=Math.hypot(a.x-b.x,a.y-b.y);const need=a.dashing?1.1:1.22;if(ra>=rb*need&&d<ra*.85+rb*.15){if(b.peer){if(a===me&&!b.hit){b.hit=1;emitK(b.peer);a.kills++;a.sc+=b.m*6;dropFood(b.x,b.y,b.m);burst(b.x,b.y,24,b.col,240);sfx('kill');toast('Bạn hạ '+b.name+'!')}}
   else if(b.alive){const bm=b.m;b.alive=false;addMass(a,bm*.25);a.kills++;a.sc+=bm*6;burst(b.x,b.y,28,b.col,260);dropFood(b.x,b.y,bm);if(b===me){die(me,a)}else{b.respawn=3;if(a===me){sfx('kill');toast('Bạn hạ '+b.name+'! 🎉')}}if(b.bot)b.respawn=3;}}}}}
function respawnBots(dt){bots.forEach((b,i)=>{if(!b.alive){b.respawn-=dt;if(b.respawn<=0)bots[i]=mk(true,NAMES[(Math.random()*NAMES.length)|0])}})}
// ---------- network ----------
let lastP=0;
function emit(t,d){try{room&&room.emit(t,d)}catch(e){}}
function emitK(v){emit('kill',{v,by:myPeer})}
function pushPres(){if(!room)return;try{room.presence(me&&me.alive?{x:Math.round(me.x),y:Math.round(me.y),m:Math.round(me.m*10)/10,bi:me.bi,c:me.col,n:me.name,k:me.kills,s:Math.round(me.sc),a:1,d:me.dashing?1:0}:{a:0})}catch(e){}}
function syncPeers(){if(!room)return;const seen={};for(const p of room.peers()){if(p.sameTab){myPeer=p.peer;continue}if(p.isMe||p.kind!=='viewer'||p.presence.a===undefined)continue;seen[p.peer]=1;const q=p.presence;let o=peers[p.peer];if(!o){o=peers[p.peer]={peer:p.peer,x:q.x,y:q.y,vx:0,vy:0,m:q.m||10,ang:0,ph:0,bl:0};if(S.mode==='play')toast((q.n||'Một mèo')+' vừa vào đấu trường! 🐾')}
  o.alive=!!q.a;if(q.a){o.vx=(q.x-o.x)*8;o.vy=(q.y-o.y)*8;o.x+=(q.x-o.x)*.25;o.y+=(q.y-o.y)*.25;o.m=q.m;o.bi=q.bi;o.col=q.c;o.name=q.n||'Mèo';o.kills=q.k||0;o.sc=q.s||0;o.dashing=!!q.d;o.ph+=.3;if(!o.alive0)o.hit=0;}o.alive0=o.alive;if(!o.alive)o.hit=0}
 for(const k in peers)if(!seen[k])delete peers[k];const n=Object.keys(peers).length+1;$('net').textContent=n>1?`🟢 Online: ${n} người chơi trong phòng`:'🟢 Phòng online sẵn sàng — gửi link cho bạn bè!'}
async function initNet(){try{const c=window.claude&&await claude.use('room');if(!c){$('net').textContent='⚪ Chơi offline (chưa kết nối phòng). Bot vẫn hoạt động.';return}room=c;room.on('eat',m=>{if(!m.isMe&&food[m.data]){food[m.data].a=false;food[m.data].t=S.t+25}});room.on('kill',m=>{if(m.data&&m.data.v===myPeer&&me&&me.alive&&S.mode==='play'){const k=peers[m.data.by];me.alive=false;die(me,k||{name:'?'})}});room.onPeers(()=>{});syncPeers()}catch(e){$('net').textContent='⚪ Chơi offline (phòng online không khả dụng).'}}
// ---------- game over / UI ----------
function rank(){const l=board();return l.findIndex(x=>x.me)+1}
function board(){const a=all().map(e=>({n:e.name,s:Math.round(e.sc),me:e===me}));return a.sort((x,y)=>y.s-x.s)}
function gameOver(k){if(S.mode!=='play')return;S.mode='over';const sc=Math.round(me.sc);best=Math.max(best,sc);$('gos').innerHTML=`Bị hạ bởi <b>${k&&k.name||'?'}</b><br>Điểm: <b>${sc}</b> (kỷ lục ${best}) · Kill: <b>${me.kills}</b><br>Kích thước: <b>${Math.round(me.m)}</b> · Hạng: <b>#${S.lastRank||'-'}</b>`;$('go').classList.remove('hide');['dash'].forEach(i=>$(i).classList.add('hide'))}
function hud(){const l=board(),r=l.findIndex(x=>x.me)+1;S.lastRank=r;$('hud').innerHTML=me?`⭐ Điểm: <b>${Math.round(me.sc)}</b><br>📏 Size: <b>${Math.round(me.m)}</b><br>⚔ Kill: <b>${me.kills}</b><br>🏆 Hạng: <b>#${r||'-'}</b>/${l.length}`:'';$('lb').innerHTML='<b>🏆 Bảng xếp hạng</b>'+l.slice(0,6).map((x,i)=>`<div class="${x.me?'me':''}"><span>${i+1}. ${x.n}</span><span>${x.s}</span></div>`).join('')}
// ---------- customize ----------
const pv=$('pv').getContext('2d');let pt=0;
function renderChips(){$('chips').innerHTML='';B.forEach((b,i)=>{const e=document.createElement('div');e.className='chip'+(i===S.breed?' on':'');e.textContent=b.n;e.onclick=()=>{S.breed=i;S.col=null;$('col').value=b.c;renderChips();sfx('click')};$('chips').appendChild(e)})}
function prevLoop(){if(!$('cz').classList.contains('hide')){pt+=.05;pv.clearRect(0,0,220,200);drawCat(pv,110,105,58,S.breed,S.col||B[S.breed].c,pt*3,Math.sin(pt)>.97)}requestAnimationFrame(prevLoop)}
$('cust').onclick=()=>{sfx('click');$('menu').classList.add('hide');$('cz').classList.remove('hide');$('col').value=S.col||B[S.breed].c;renderChips()};
$('col').oninput=e=>{S.col=e.target.value};$('rc').onclick=()=>{S.col=null;$('col').value=B[S.breed].c;sfx('click')};
$('ok').onclick=()=>{sfx('click');$('cz').classList.add('hide');$('menu').classList.remove('hide')};
$('play').onclick=()=>{S.name=$('nm').value.trim();ac();startGame()};
$('rs').onclick=()=>{sfx('restart');startGame()};$('gm').onclick=()=>{sfx('click');S.mode='menu';me=null;pushPres();$('go').classList.add('hide');$('menu').classList.remove('hide');['hud','lb','mm','snd','dash'].forEach(i=>$(i).classList.add('hide'))};
$('dash').addEventListener('pointerdown',e=>{e.stopPropagation();keys.dash=1});$('dash').addEventListener('pointerup',()=>keys.dash=0);
// ---------- input ----------
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.has=true});cv.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.has=true;mouse.down=true});addEventListener('pointerup',()=>mouse.down=false);
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
// ---------- loop ----------
let last=performance.now(),stepT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;syncPeers();
 if(S.mode==='play'&&me&&me.alive){let ta=me.ang;const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(kx||ky){ta=Math.atan2(ky,kx);mouse.has=false}else if(mouse.has)ta=Math.atan2(mouse.y-innerHeight/2,mouse.x-innerWidth/2);
  const dsh=keys[' ']||keys.dash||mouse.down;move(me,dt,ta,dsh);eatStuff(me);stepT+=dt;if(stepT>.28){stepT=0;sfx('step')}
  if(dsh&&me.m>12&&!me._d)sfx('atk');me._d=dsh;
  bots.forEach(b=>{if(!b.alive)return;think(b,dt);const m=Math.hypot(b.x-b.ai.tx,b.y-b.ai.ty);let ta2=Math.atan2(b.ai.ty-b.y,b.ai.tx-b.x);const r=rad(b.m);if(b.x<r+120||b.x>W-r-120||b.y<r+120||b.y>W-r-120)ta2=Math.atan2(W/2-b.y,W/2-b.x);move(b,dt,ta2,b.ai.dsh);eatStuff(b)});
  fight();respawnBots(dt);if(now-lastP>50){lastP=now;pushPres()}
  food.forEach(f=>{if(!f.a&&S.t>f.t)f.a=true});for(let i=drops.length-1;i>=0;i--){drops[i].l-=dt;if(drops[i].l<=0)drops.splice(i,1)}
  cam.x+=(me.x-cam.x)*Math.min(1,dt*8);cam.y+=(me.y-cam.y)*Math.min(1,dt*8);const tz=clamp(1.2-Math.sqrt(rad(me.m))*.055,.42,1.1);cam.z+=(tz-cam.z)*Math.min(1,dt*2);
  if(((now/250)|0)!==S.hh){S.hh=(now/250)|0;hud()}}
 else if(S.mode!=='play'){cam.x+=(W/2-cam.x)*.01;bots.forEach(b=>{if(b.alive){think(b,dt);move(b,dt,Math.atan2(b.ai.ty-b.y,b.ai.tx-b.x),false);eatStuff(b)}});food.forEach(f=>{if(!f.a&&S.t>f.t)f.a=true})}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}shake*=.88;draw();requestAnimationFrame(frame)}
function draw(){const w=innerWidth,h=innerHeight;g.fillStyle='#2f6b4f';g.fillRect(0,0,w,h);g.save();const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;g.translate(w/2+sx,h/2+sy);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
 const vx0=cam.x-w/2/cam.z-60,vx1=cam.x+w/2/cam.z+60,vy0=cam.y-h/2/cam.z-60,vy1=cam.y+h/2/cam.z+60;
 g.fillStyle='#3a8060';g.fillRect(0,0,W,W);g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=2;g.beginPath();for(let x=Math.max(0,Math.floor(vx0/100)*100);x<Math.min(W,vx1);x+=100){g.moveTo(x,Math.max(0,vy0));g.lineTo(x,Math.min(W,vy1))}for(let y=Math.max(0,Math.floor(vy0/100)*100);y<Math.min(W,vy1);y+=100){g.moveTo(Math.max(0,vx0),y);g.lineTo(Math.min(W,vx1),y)}g.stroke();
 g.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<40;i++){const x=(i*977)%W,y=(i*1531)%W;if(x>vx0&&x<vx1&&y>vy0&&y<vy1){g.beginPath();g.arc(x,y,60+(i%5)*20,0,TAU);g.fill()}}
 g.strokeStyle='#ff6b6b';g.lineWidth=12;g.strokeRect(0,0,W,W);
 for(const f of food){if(!f.a||f.x<vx0||f.x>vx1||f.y<vy0||f.y>vy1)continue;g.fillStyle=`hsl(${f.h},85%,62%)`;g.beginPath();g.arc(f.x,f.y,f.v>1?9:5.5,0,TAU);g.fill()}
 for(const f of drops){if(f.x<vx0||f.x>vx1||f.y<vy0||f.y>vy1)continue;const p=.6+.4*Math.sin(S.t*8+f.h);g.fillStyle=`hsla(${f.h},95%,70%,${p})`;g.shadowColor='#fff';g.shadowBlur=14;g.beginPath();g.arc(f.x,f.y,8,0,TAU);g.fill();g.shadowBlur=0}
 const L=all().sort((a,b)=>a.m-b.m);g.textAlign='center';g.font='bold 14px Trebuchet MS';
 for(const e of L){if(e.x<vx0-100||e.x>vx1+100||e.y<vy0-100||e.y>vy1+100)continue;const r=rad(e.m);g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(e.x,e.y+r*1.0,r*.9,r*.3,0,0,TAU);g.fill();
  if(e.dashing){g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=3;g.beginPath();g.moveTo(e.x-e.vx*.08,e.y-e.vy*.08);g.lineTo(e.x-e.vx*.2,e.y-e.vy*.2);g.stroke()}
  drawCat(g,e.x,e.y,r,e.bi,e.col,e.ph,e.bl>0);g.fillStyle=e===me?'#ffd27a':'#fff';g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=3;g.strokeText(e.name,e.x,e.y-r*1.5-6);g.fillText(e.name,e.x,e.y-r*1.5-6)}
 for(const p of parts){g.globalAlpha=clamp(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,4,0,TAU);g.fill()}g.globalAlpha=1;g.restore();
 if(S.mode==='play'&&me){mg.clearRect(0,0,120,120);const k=120/W;mg.fillStyle='rgba(255,255,255,.35)';for(const e of all()){if(e===me)continue;mg.fillStyle=e.peer?'#6bd5ff':'#ff8a8a';mg.fillRect(e.x*k-2,e.y*k-2,4,4)}if(me.alive){mg.fillStyle='#ffd27a';mg.beginPath();mg.arc(me.x*k,me.y*k,4,0,TAU);mg.fill()}}}
// peers drawn through all(); mark peers
const _all=all;all=function(){const a=_all();a.forEach(e=>{if(e.peer===undefined)return});return a};
for(let i=0;i<7;i++)bots.push(mk(true,NAMES[i]));
setSnd();prevLoop();initNet();requestAnimationFrame(frame);
</script></body></html>
