<script>
/*RULES-BEGIN*/
/* KHÁNH MIU — LUẬT CHƠI DÙNG CHUNG (server + chế độ offline trong index.html).
 * Mọi thực thể (người chơi, bot) đi qua CÙNG các hàm này: không có nhánh riêng cho "người" hay "AI".
 * Sau khi sửa file này chạy:  node tools/sync-rules.js   (chép bản sao vào index.html; test sẽ kiểm tra khớp).
 * Đơn vị: kg (cân nặng). Cân nặng quyết định bán kính: rad(kg). */
(function (root, factory) { if (typeof module === 'object' && module.exports) module.exports = factory(); else root.KMRules = factory() })(this, function () {
  'use strict';
  const CFG = {
    W: 4200,
    // ----- cân nặng (kg) -----
    SPAWN_KG: 10, MIN_KG: 6, MAX_KG: 250,   // xuất hiện / sàn không thể giảm thấp hơn / trần tăng trưởng
    FOOD_GAIN_K: 1.5, FOOD_GAIN_SOFT: 110,  // tăng = v*K/(1+kg/SOFT): càng nặng ăn càng tăng chậm
    DECAY_ABOVE: 30, DECAY_PER_SEC: .0015,  // trên 30kg hao dần 0.15%/s (chống tăng trưởng vô hạn)
    // ----- nuốt -----
    SWALLOW_WEIGHT_RATIO: 1.6,  // nặng hơn mục tiêu >= 1.6 lần mới nuốt được
    DASH_SWALLOW_RATIO: 1.4,    // khi đang lao (dash) ngưỡng hạ xuống 1.4 lần
    // Tầm nuốt = bán kính thân kẻ săn (+25% khi đang lao) + 30% bán kính mồi: chạm thân là nuốt, mồi bị phủ ~1/3 là đủ. (v2: 0.85/0.15 => phải gần như trùng tâm mới nuốt)
    REACH_BODY: 1.0, REACH_PREY: .3, LUNGE_REACH: .25,
    SWALLOW_GAIN: .25,          // nuốt mồi tăng thêm 25% cân nặng mồi (qua công thức ăn)
    SWALLOW_DROP: .55,          // mồi để lại thức ăn tổng trị giá 55% cân nặng
    // ----- tốc độ / chạy nhanh -----
    BASE_SPEED: 215, SPEED_EXP: .1, DASH_MULT: 1.75,
    ENERGY_MAX: 100,            // thanh "thức ăn dự trữ" 0..100
    DASH_DRAIN: 18,             // tiêu hao/giây khi chạy nhanh (cho mèo 10kg; mèo nặng hơn hao chậm hơn)
    DRAIN_KG_EXP: .25,          // drain *= (10/kg)^0.25
    DASH_MIN_START: 12,         // cạn kiệt thì phải hồi lại >= 12 mới chạy nhanh tiếp
    ENERGY_REGEN: 2.5,          // hồi/giây khi KHÔNG chạy nhanh
    ENERGY_PER_V: 2,            // mỗi 1 giá trị thức ăn hồi 2 năng lượng (đủ để kéo dài, không đủ để chạy nhanh vô hạn)
    DASH_BURN_FRAC: .012, DASH_BURN_MIN: .12, // chạy nhanh đốt cân: max(0.12, 1.2%*kg) kg/giây
    // ----- bù độ trễ mạng (server) -----
    LAG_MAX_MS: 300, INTERP_MS: 100
  };
  const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rad = kg => 12 + 3.2 * Math.sqrt(kg);
  const speedOf = (kg, dash) => CFG.BASE_SPEED * Math.pow(rad(kg) / 14, -CFG.SPEED_EXP) * (dash ? CFG.DASH_MULT : 1);
  const newBody = (e, kg) => { e.kg = kg; e.en = CFG.ENERGY_MAX; e.tired = false; e.dashing = false; return e };
  // Chuyển động + chạy nhanh + hao cân + hồi năng lượng cho MỌI thực thể.
  function stepBody(e, dt, ta, wantDash) {
    e.px = e.x; e.py = e.y; // vị trí đầu bước: dùng cho va chạm quét (swept) để chạy nhanh không xuyên qua mồi
    let da = ta - e.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); e.ang += clamp(da, -6 * dt, 6 * dt);
    const can = wantDash && !e.tired && e.en > 0 && e.kg > CFG.MIN_KG + .5;
    if (can) {
      e.en -= CFG.DASH_DRAIN * Math.pow(CFG.SPAWN_KG / Math.max(e.kg, CFG.SPAWN_KG), CFG.DRAIN_KG_EXP) * dt;
      if (e.en <= 0) { e.en = 0; e.tired = true }
      e.kg = Math.max(CFG.MIN_KG, e.kg - Math.max(CFG.DASH_BURN_MIN, CFG.DASH_BURN_FRAC * e.kg) * dt); e.dashing = true;
    } else { e.dashing = false; restEnergy(e, dt) }
    const sp = speedOf(e.kg, e.dashing);
    e.vx = Math.cos(e.ang) * sp; e.vy = Math.sin(e.ang) * sp; e.x += e.vx * dt; e.y += e.vy * dt;
    const r = rad(e.kg); e.x = clamp(e.x, r, CFG.W - r); e.y = clamp(e.y, r, CFG.W - r);
    if (e.ph !== undefined) e.ph += dt * sp / 22;
    if (e.kg > CFG.DECAY_ABOVE) e.kg -= e.kg * CFG.DECAY_PER_SEC * dt;
  }
  function restEnergy(e, dt) { e.en = Math.min(CFG.ENERGY_MAX, e.en + CFG.ENERGY_REGEN * dt); if (e.tired && e.en >= CFG.DASH_MIN_START) e.tired = false }
  // Ăn thức ăn giá trị v: tăng cân (có trần) + hồi năng lượng. Trả về số kg tăng thực tế.
  function feed(e, v) {
    const old = e.kg; e.kg = Math.min(CFG.MAX_KG, e.kg + v * CFG.FOOD_GAIN_K / (1 + e.kg / CFG.FOOD_GAIN_SOFT));
    e.en = Math.min(CFG.ENERGY_MAX, e.en + v * CFG.ENERGY_PER_V); if (e.tired && e.en >= CFG.DASH_MIN_START) e.tired = false; return e.kg - old;
  }
  const canSwallow = (a, b) => a.kg >= b.kg * (a.dashing ? CFG.DASH_SWALLOW_RATIO : CFG.SWALLOW_WEIGHT_RATIO);
  const reachOf = (a, bKg) => rad(a.kg) * (CFG.REACH_BODY + (a.dashing ? CFG.LUNGE_REACH : 0)) + rad(bKg) * CFG.REACH_PREY;
  const teleport = (e, x, y) => { e.x = e.px = x; e.y = e.py = y };
  // Khoảng cách NHỎ NHẤT giữa kẻ săn a và mồi t trong suốt 1 tick (cả hai di chuyển thẳng đều từ vị trí đầu tick tới cuối tick).
  // Nhờ vậy chạy nhanh / chênh lệch vận tốc lớn vẫn không "xuyên qua" mồi giữa hai lần kiểm tra.
  function sweptDist(a, t) {
    const rx0 = t.x0 - (a.px === undefined ? a.x : a.px), ry0 = t.y0 - (a.py === undefined ? a.y : a.py), dx = (t.x1 - a.x) - rx0, dy = (t.y1 - a.y) - ry0, dd = dx * dx + dy * dy;
    const s = dd > 1e-9 ? clamp(-(rx0 * dx + ry0 * dy) / dd, 0, 1) : 0; return Math.hypot(rx0 + dx * s, ry0 + dy * s);
  }
  const trackOf = b => ({ x0: b.px === undefined ? b.x : b.px, y0: b.py === undefined ? b.y : b.py, x1: b.x, y1: b.y });
  // Tìm các vụ nuốt hợp lệ trong 1 tick. track(a,b) cho phép server "tua lại" quỹ đạo mục tiêu (bù trễ); mặc định quỹ đạo thật trong tick.
  // Mỗi mồi chỉ có tối đa 1 kẻ săn (kẻ ăn sâu nhất, hoà thì nặng hơn) => không thể 2 kẻ cùng nuốt 1 mục tiêu.
  function findSwallows(list, track) {
    const best = new Map();
    for (const a of list) {
      if (!a.alive) continue;
      for (const b of list) {
        if (a === b || !b.alive || !canSwallow(a, b)) continue;
        const rc = reachOf(a, b.kg);
        if (Math.abs(a.x - b.x) > rc + 600 && Math.abs(a.y - b.y) > rc + 600) continue; // loại nhanh các cặp ở rất xa
        const d = sweptDist(a, (track && track(a, b)) || trackOf(b));
        if (d > rc) continue;
        const depth = d / rc, cur = best.get(b);
        if (!cur || depth < cur.depth || (depth === cur.depth && a.kg > cur.a.kg)) best.set(b, { a, b, depth });
      }
    }
    return [...best.values()].sort((x, y) => y.a.kg - x.a.kg || x.depth - y.depth).map(x => [x.a, x.b]);
  }
  // Thực hiện vụ nuốt (mutate). Trả về {gain, preyKg}. Người gọi lo hiệu ứng/thức ăn rơi.
  function applySwallow(a, b) { const preyKg = b.kg; b.alive = false; const gain = feed(a, preyKg * CFG.SWALLOW_GAIN); a.kills = (a.kills || 0) + 1; return { gain, preyKg } }
  const dropPlan = kg => { const n = Math.min(45, Math.max(4, kg / 2.2 | 0)); return { n, v: kg * CFG.SWALLOW_DROP / n + .4 } };
  // ===== AI bot: 3 cấp độ khác nhau về HÀNH VI (không chỉ tăng tốc độ/cân nặng). Dùng chung server + offline. =====
  // Công bằng: bot chỉ "thấy" mèo trong bán kính `sight` (nhỏ hơn khung nhìn của người chơi) và dùng đúng luật dash/năng lượng như người chơi.
  const DIFF = {
    easy:   { react: [.6, 1.0],  sight: 420, fleeDist: 230, fleeDash: false, huntBot: .35, huntHuman: .12, lead: 0,  dash: 'never', score: false, retreat: false, foodR: 600 },
    normal: { react: [.25, .5],  sight: 520, fleeDist: 520, fleeDash: true,  huntBot: 1,   huntHuman: 1,   lead: .3, dash: 'near',  score: false, retreat: false, foodR: 700 },
    hard:   { react: [.12, .22], sight: 650, fleeDist: 560, fleeDash: true,  huntBot: 1,   huntHuman: 1,   lead: -1, dash: 'lunge', score: true,  retreat: true,  foodR: 900 }
  };
  const DIF_NAMES = ['easy', 'normal', 'hard'];
  // lists = [danh sách thức ăn, thức ăn rơi, pate]; mục nào có a===false thì bỏ qua. Trạng thái nhớ trong b.ai (mode, commit, ignore, retreat).
  function think(b, dt, list, lists, dif) {
    const D = DIFF[dif] || DIFF.normal, a = b.ai; a.clock = (a.clock || 0) + dt; a.t -= dt; if (a.t > 0) return;
    a.t = D.react[0] + Math.random() * (D.react[1] - D.react[0]);
    const r = rad(b.kg), W = CFG.W, hard = dif === 'hard', mySp = speedOf(b.kg, false), threatKg = b.kg * CFG.SWALLOW_WEIGHT_RATIO * (hard ? .8 : .85);
    // 1) Quan sát trong tầm nhìn
    let nT = null, nd = D.fleeDist, fx = 0, fy = 0; const threats = [], cands = [];
    for (const o of list) {
      if (o === b) continue;
      const d = Math.hypot(o.x - b.x, o.y - b.y); if (d > D.sight) continue;
      if (o.kg >= threatKg) { threats.push(o); if (d < D.fleeDist) { const w = (D.fleeDist - d + 50) / Math.max(d, 20); fx += (b.x - o.x) * w; fy += (b.y - o.y) * w; if (d < nd) { nd = d; nT = o } } }
      else if (canSwallow({ kg: b.kg, dashing: false }, o)) cands.push({ o, d });
    }
    // 2) Bỏ chạy
    if (nT) {
      a.mode = 'flee';

function dropFood(x,y,m){const pl=RL.dropPlan(m),n=pl.n;for(let i=0;i<n;i++){const a=rnd(0,TAU),d=rnd(5,rad(m)*1.6);drops.push({x:clamp(x+Math.cos(a)*d,40,W-40),y:clamp(y+Math.sin(a)*d,40,W-40),v:pl.v,h:rnd(0,360),l:60,i:(Math.random()*997)|0})}}
// ---------- entities ----------
function all(){const a=[me,...bots].filter(e=>e&&e.alive);for(const k in peers){const p=peers[k];if(p.alive)a.push(p)}return a}
function die(e,killer){e.alive=false;shake=e===me?14:shake;if(e.bot){e.respawn=3}if(e!==me&&!e.bot)return;if(e===me){sfx('die');dropFood(e.x,e.y,e.kg);setTimeout(gameOver,900,killer)}}
function addMass(e,v){const old=e.kg,g=RL.feed(e,v);if(e===me){if(e.kg>old&&((old/25)|0)!==((e.kg/25)|0))sfx('grow');gainFx(g)}return g}
function think(b,dt){RL.think(b,dt,all(),[food,drops,pates],S.dif)}
function move(e,dt,ta,dash){RL.stepBody(e,dt,ta,dash);if(e===me&&e.dashing&&Math.random()<.08)sfx('dash');e.bl=(Math.random()<.004)?.15:Math.max(0,e.bl-dt)}
function eatStuff(e,bot){const r=rad(e.kg);for(let i=0;i<food.length;i++){const f=food[i];if(f.a&&Math.abs(f.x-e.x)<r+8&&Math.abs(f.y-e.y)<r+8&&Math.hypot(f.x-e.x,f.y-e.y)<r+6){f.a=false;f.t=S.t+25;addMass(e,f.v);if(e===me){sfx('eat');burst(f.x,f.y,3,`hsl(${f.h},90%,65%)`,60)}}}
 for(let i=drops.length-1;i>=0;i--){const f=drops[i];if(Math.hypot(f.x-e.x,f.y-e.y)<r+8){drops.splice(i,1);addMass(e,f.v);if(e===me)sfx('loot')}}
 for(let i=pates.length-1;i>=0;i--){const p=pates[i];if(Math.hypot(p.x-e.x,p.y-e.y)<r+14){pates.splice(i,1);addMass(e,PATE_V);pateFx(p.x,p.y,e===me)}}}
function fight(){for(const[a,b]of RL.findSwallows(all())){if(!a.alive||!b.alive)continue;const r=RL.applySwallow(a,b);dropFood(b.x,b.y,r.preyKg);swallowFx(a,b,r.gain);if(b===me)die(me,a);else if(b.bot)b.respawn=3}}
function respawnBots(dt){bots.forEach((b,i)=>{if(!b.alive){b.respawn-=dt;if(b.respawn<=0)bots[i]=mk(true,NAMES[(Math.random()*NAMES.length)|0])}})}
// ---------- CÁ: thức ăn dạng cá nhỏ. Sprite dựng sẵn 1 lần (màu x cỡ x hướng x vẫy đuôi x kiểu) rồi chỉ drawImage => rẻ hơn vẽ path mỗi khung ----------
const fishCache=new Map(),FISH_HUES=12;
function fishSprite(hb,big,ai,frame,kind){const key=(((hb*2+big)*8+ai)*2+frame)*3+kind;let c=fishCache.get(key);if(c)return c;
 const L=big?46:29,N=Math.ceil(L*1.45)+2,cv=document.createElement('canvas');cv.width=cv.height=N;const x=cv.getContext('2d');x.translate(N/2,N/2);const a=ai*TAU/8;x.rotate(a);if(Math.cos(a)<-.01)x.scale(1,-1);
 const hue=hb*30+8,body=`hsl(${hue},82%,58%)`,dark=`hsl(${hue},70%,38%)`,belly=`hsl(${hue},92%,84%)`,w=frame?L*.1:-L*.1;
 x.lineJoin='round';x.fillStyle=dark;x.beginPath();x.moveTo(-L*.2,0);x.lineTo(-L*.5,-L*.22+w);x.lineTo(-L*.46,w*.4);x.lineTo(-L*.5,L*.22+w);x.closePath();x.fill();            // đuôi chẻ, vẫy
 x.beginPath();x.moveTo(-L*.08,-L*.17);x.quadraticCurveTo(L*.02,-L*.4,L*.2,-L*.16);x.closePath();x.fill();                                                                   // vây lưng
 x.fillStyle=body;x.beginPath();x.ellipse(L*.06,0,L*.37,L*.21,0,0,TAU);x.fill();                                                                                                // thân
 x.fillStyle=belly;x.beginPath();x.ellipse(L*.08,L*.08,L*.29,L*.09,0,0,TAU);x.fill();                                                                                           // bụng sáng
 if(kind===1){x.strokeStyle=dark;x.lineWidth=Math.max(1.3,L*.06);for(const o of[-.12,.03,.18]){x.beginPath();x.moveTo(L*o,-L*.17);x.lineTo(L*o+L*.03,L*.12);x.stroke()}}                  // kiểu sọc
 else if(kind===2){x.fillStyle=dark;for(const[px,py]of[[-.1,-.05],[.05,.06],[.16,-.07],[-.02,.1]]){x.beginPath();x.arc(L*px,L*py,L*.035,0,TAU);x.fill()}}                          // kiểu đốm
 x.fillStyle='#fff';x.beginPath();x.arc(L*.27,-L*.04,L*.07,0,TAU);x.fill();x.fillStyle='#1b1b22';x.beginPath();x.arc(L*.29,-L*.04,L*.038,0,TAU);x.fill();                      // mắt
 x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.1;x.beginPath();x.ellipse(L*.06,0,L*.37,L*.21,0,0,TAU);x.stroke();fishCache.set(key,cv);return cv}
function drawFish(f,i,pn,drop){const fr=((pn/330+i*.37)|0)&1;let sp=fr?f.s1:f.s0;
 if(!sp){const hb=((f.h/30)|0)%FISH_HUES,big=f.v>1&&!drop?1:0,ai=(i*5+(i>>3))&7,kind=i%3;sp=fishSprite(hb,big,ai,fr,kind);if(fr)f.s1=sp;else f.s0=sp} // tham chiếu sprite lưu sẵn trên từng cá: khỏi tính lại chỉ số mỗi khung
 const bob=Math.sin(pn/500+i)*1.6,sz=drop?sp.width*.85:sp.width;
 if(drop){g.globalAlpha=.22+.14*Math.sin(pn/160+i);g.fillStyle='#fff';g.beginPath();g.arc(f.x,f.y+bob,sz*.52,0,TAU);g.fill();g.globalAlpha=1}
 g.drawImage(sp,f.x-sz/2,f.y+bob-sz/2,sz,sz)}
// ---------- độ khó ----------
const DIF_TXT={easy:['EASY','Bot ít săn bạn, phản ứng chậm, ưu tiên kiếm cá, chỉ thấy gần.'],normal:['NORMAL','Bot kiếm cá, săn mèo nhỏ, tránh mèo lớn, biết đuổi và bỏ chạy.'],hard:['HARD','Bot chọn mục tiêu, chặn đầu, chỉ lao khi đủ gần, rút lui khi hết sức, tránh bị dồn vào góc.']};
const difLabel=d=>(DIF_TXT[d]||DIF_TXT.normal)[0];
function setDif(d){if(!DIF_TXT[d])return;S.dif=d;try{localStorage.setItem('khanhmiu.dif',d)}catch(e){}document.querySelectorAll('#difrow button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));$('dh').textContent=DIF_TXT[d][1]+(S.online?'':' (Phòng đã tạo thì dùng độ khó của người tạo.)')}
// ---------- helpers ----------
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPlayUI(){S.mode='play';['menu','cz','go','st'].forEach(i=>$(i).classList.add('hide'));['hud','lb','mm','snd','gear'].forEach(i=>$(i).classList.remove('hide'));if('ontouchstart'in window)$('dash').classList.remove('hide');ac();music();sfx('start');sfx('spawn')}
// ---------- PATE (thức ăn hiếm) ----------
const PATE_V=8;
function offlinePate(dt){S.pt-=dt;if(S.pt<=0){S.pt=6;if(pates.length<3&&Math.random()<.35)pates.push({id:++S.pid,x:rnd(200,W-200),y:rnd(200,W-200),l:75})}for(let i=pates.length-1;i>=0;i--){pates[i].l-=dt;if(pates[i].l<=0)pates.splice(i,1)}}
function pateFx(x,y,mine){burst(x,y,18,'#ffd166',240);burst(x,y,14,'#ff5ea8',200);rings.push({x,y,l:.7});if(mine){sfx('pate');shake=Math.max(shake,5);toast('🥫 PATE! Lớn nhanh!')}else if(me&&Math.hypot(me.x-x,me.y-y)<700)sfx('pate')}
function drawPate(p){const pu=.5+.5*Math.sin(S.t*4+p.x*.01),r=14+pu*1.5;g.save();g.translate(p.x,p.y);
 const gr=g.createRadialGradient(0,0,3,0,0,44+pu*10);gr.addColorStop(0,`rgba(255,214,102,${.35+.35*pu})`);gr.addColorStop(1,'rgba(255,214,102,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,56,0,TAU);g.fill();
 g.fillStyle='#a31d52';g.beginPath();g.ellipse(0,7,r,r*.5,0,0,TAU);g.fill();g.fillRect(-r,-3,2*r,10);g.fillStyle='#ff5ea8';g.fillRect(-r,0,2*r,5);
 g.fillStyle='#ffd166';g.beginPath();g.ellipse(0,-3,r,r*.5,0,0,TAU);g.fill();g.fillStyle='#fff3c4';g.beginPath();g.ellipse(0,-3,r*.76,r*.36,0,0,TAU);g.fill();
 g.fillStyle='#ff7aa8';g.beginPath();g.ellipse(-1,-3,6,2.8,0,0,TAU);g.fill();g.beginPath();g.moveTo(4,-3);g.lineTo(9,-6.5);g.lineTo(9,.5);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-4.5,-3.6,.9,0,TAU);g.fill();
 for(let i=0;i<3;i++){const a=S.t*2+i*2.1,sx=Math.cos(a)*(r+9),sy=Math.sin(a)*(r*.6+7)-4,s=2+1.8*Math.sin(S.t*7+i*2);g.fillStyle='#fff6c9';g.beginPath();g.moveTo(sx,sy-s*2);g.lineTo(sx+s*.6,sy-s*.6);g.lineTo(sx+s*2,sy);g.lineTo(sx+s*.6,sy+s*.6);g.lineTo(sx,sy+s*2);g.lineTo(sx-s*.6,sy+s*.6);g.lineTo(sx-s*2,sy);g.lineTo(sx-s*.6,sy-s*.6);g.fill()}
 if(me&&me.alive&&Math.hypot(me.x-p.x,me.y-p.y)<300){g.textAlign='center';g.font='bold 15px Trebuchet MS';g.strokeStyle='rgba(0,0,0,.7)';g.lineWidth=4;g.strokeText('PATE',0,-30);g.fillStyle='#ffd166';g.fillText('PATE',0,-30)}
 g.restore()}
// ---------- kg / hiệu ứng / năng lượng ----------
const fmtKg=k=>(k>=100?Math.round(k):k.toFixed(1))+' kg';
let ghosts=[],floats=[],best=0;try{best=+localStorage.getItem('khanhmiu.best')||0}catch(e){}
function floatText(x,y,txt,col){floats.push({x,y,t:0,T:1.1,txt,col:col||'#ffd27a'})}
function gainFx(g){if(!me||g<.04)return;me.gainAcc=(me.gainAcc||0)+g}
function flushGain(dt){if(!me)return;me.gainT=(me.gainT||0)-dt;if(me.gainT<=0&&(me.gainAcc||0)>=.04){floatText(me.x,me.y-rad(me.dk||me.kg)*1.9,'+'+me.gainAcc.toFixed(1)+' kg','#9fe3a8');me.gainAcc=0;me.gainT=.45}}
// Hiệu ứng NUỐT dùng chung offline/online: mồi bị hút nhỏ dần vào miệng kẻ săn, kẻ săn "ợ" phình ra, chữ +kg bay lên.
function swallowFx(a,b,gain){const bx=b.x,by=b.y;ghosts.push({e:{...b},t:0,T:.4,a,bx,by});burst(bx,by,16,b.col,200);
 if(a){a.gulp=.35;floatText(a.x,a.y-rad(a.dk||a.kg)*1.9,'+'+gain.toFixed(1)+' kg','#ffd27a')}
 if(a===me){sfx('kill');shake=Math.max(shake,6);toast('Bạn nuốt '+b.name+'! +'+gain.toFixed(1)+' kg 🎉')}
 else if(b===me){}else if(me&&Math.hypot(me.x-bx,me.y-by)<700)sfx('gulp')}
function stepFx(dt){for(let i=ghosts.length-1;i>=0;i--){ghosts[i].t+=dt;if(ghosts[i].t>=ghosts[i].T)ghosts.splice(i,1)}for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>=floats[i].T)floats.splice(i,1)}
 for(const e of all()){if(e.dk===undefined)e.dk=e.kg;e.dk+=(e.kg-e.dk)*Math.min(1,dt*7);if(e.gulp>0)e.gulp-=dt}flushGain(dt)}
function drawFx(){for(const gh of ghosts){const k=gh.t/gh.T,ez=k*k*(3-2*k),px=gh.a?gh.a.x:gh.bx,py=gh.a?gh.a.y:gh.by,x=gh.bx+(px-gh.bx)*ez,y=gh.by+(py-gh.by)*ez,r=rad(gh.e.dk||gh.e.kg)*(1-ez*.92);g.globalAlpha=1-k*.5;drawCat(g,x,y,Math.max(2,r),gh.e.bi,gh.e.col,gh.e.ph||0,false);g.globalAlpha=1}
 g.textAlign='center';for(const f of floats){const k=f.t/f.T;g.globalAlpha=1-k*k;g.font='bold '+(16/cam.z).toFixed(1)+'px Trebuchet MS';g.strokeStyle='rgba(0,0,0,.65)';g.lineWidth=3/cam.z;g.strokeText(f.txt,f.x,f.y-k*50/cam.z);g.fillStyle=f.col;g.fillText(f.txt,f.x,f.y-k*50/cam.z)}g.globalAlpha=1}
// Nhãn tên + cân nặng trên đầu: cỡ chữ theo zoom (cố định ~14px trên màn hình), tự thu gọn khi đông/ nhỏ; xanh = nuốt được, đỏ = có thể bị nuốt.
function drawLabel(e,r,crowd){const z=cam.z,rs=r*z,rel=e===me?'me':(me&&me.alive&&RL.canSwallow({kg:me.kg,dashing:false},e))?'prey':(me&&me.alive&&RL.canSwallow(e,{kg:me.kg,dashing:false}))?'thr':'n';
 const col=rel==='me'?'#ffd27a':rel==='prey'?'#9fe3a8':rel==='thr'?'#ff8a8a':'#fff',small=crowd>12||rs<11,fs=(small?12:15)/z,y0=e.y-r*1.62-6/z;
 g.lineJoin='round';g.lineWidth=(small?3:4)/z;g.strokeStyle='rgba(0,0,0,.7)';g.fillStyle=col;g.font='bold '+fs.toFixed(1)+'px Trebuchet MS';g.strokeText(fmtKg(e.kg),e.x,y0);g.fillText(fmtKg(e.kg),e.x,y0);
 if(!small||e===me){const f2=(small?11:13)/z;g.font='bold '+f2.toFixed(1)+'px Trebuchet MS';g.fillStyle=e===me?'#ffd27a':'#fff';g.lineWidth=3/z;g.strokeText(e.name,e.x,y0-fs*1.12);g.fillText(e.name,e.x,y0-fs*1.12)}}
function updEnergy(){if(!me)return;const w=$('enw');$('enf').style.width=clamp(me.en,0,100)+'%';w.classList.toggle('low',!!me.tired||me.en<20);$('enl').textContent=me.tired?'🍗 Hết sức! Ăn để hồi':'🍗 Thức ăn dự trữ '+Math.round(me.en)+'%'}
// ---------- network (WebSocket, server-authoritative) ----------
// GitHub Pages chỉ chứa frontend: điền địa chỉ backend vào CFG.server (xem README), ví dụ 'wss://khanh-miu.onrender.com'.
// Nếu index.html được chính server Node phục vụ thì không cần điền gì.
const CFG={server:''},DEFAULT_ROOM='PUBLIC';
let ws=null,net={id:0,pid:'',meta:{},tries:0,lastSend:0,leaving:false,traj:[],nAbs:0,off:null,jit:0,evq:[],rtt:0,lastPing:0,lastAng:0,lastDash:0,lastPs:0},wakeTok=0;
function srvBase(){const q=new URLSearchParams(location.search).get('server');if(q)return q.replace(/\/+$/,'');if(CFG.server)return CFG.server.replace(/\/+$/,'');if(/^https?:$/.test(location.protocol)&&!/\.github\.io$/.test(location.hostname))return location.origin;return''}
const wsUrl=()=>srvBase().replace(/^http/,'ws'),httpUrl=()=>srvBase().replace(/^ws/,'http');
function getPid(){let p='';try{p=sessionStorage.getItem('km.pid')||''}catch(e){}if(!/^[a-f0-9]{24}$/.test(p)){p=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');try{sessionStorage.setItem('km.pid',p)}catch(e){}}return p}
const cleanRoom=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
const curRoom=()=>cleanRoom($('rm').value)||DEFAULT_ROOM;
function newCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>a[b%a.length]).join('')}
function inviteLink(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',S.room);const sv=new URLSearchParams(location.search).get('server');if(sv)u.searchParams.set('server',sv);return u.toString()}
function setNet(t,c){const e=$('net');e.textContent=t;e.style.color=c||'#9fe3a8'}
function btns(dis){['play','rj','rn'].forEach(i=>$(i).disabled=dis)}
async function initMenuNet(){const q=cleanRoom(new URLSearchParams(location.search).get('room'));if(q&&!$('rm').value)$('rm').value=q;
 if(!srvBase()){setNet('⚪ Chưa cấu hình server multiplayer — chỉ chơi offline được.','#c9d3df');return}
 setNet('🟡 Đang kiểm tra server…','#ffd27a');
 try{const c=new AbortController(),to=setTimeout(()=>c.abort(),5000);const r=await fetch(httpUrl()+'/health',{signal:c.signal,cache:'no-store'});clearTimeout(to);const j=await r.json();setNet(`🟢 Server online · ${j.players} người đang chơi`+(q?` · phòng ${q}`:''))}
 catch(e){setNet('🟡 Server đang ngủ — bấm START để đánh thức (khoảng 1 phút, chỉ lần đầu)','#ffd27a');fetch(httpUrl()+'/health',{mode:'no-cors'}).catch(()=>{})}}
async function wake(tok){const u=httpUrl()+'/health',t0=Date.now();let first=true;while(Date.now()-t0<80000&&tok===wakeTok){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),7000);const r=await fetch(u,{signal:c.signal,cache:'no-store'});clearTimeout(to);if(r.ok)return true}catch(e){}if(first){first=false;setNet('🟡 Server đang thức dậy… có thể mất tới 1 phút','#ffd27a')}await new Promise(r=>setTimeout(r,1500))}return false}
async function playOnline(room){S.name=$('nm').value.trim();ac();
 if(!srvBase()){startGame();return}
 S.room=room;$('rm').value=room===DEFAULT_ROOM?'':room;try{const u=new URL(location.href);u.searchParams.set('room',room);history.replaceState(null,'',u)}catch(e){}
 const tok=++wakeTok;btns(true);setNet(`🟡 Đang kết nối phòng ${room}…`,'#ffd27a');
 const ok=await wake(tok);if(tok!==wakeTok)return;
 if(!ok){btns(false);setNet('🔴 Không kết nối được server. Thử lại hoặc chơi offline.','#ff9d9d');return}
 net.leaving=false;net.tries=0;net.pid=getPid();openWs()}
function openWs(){let sock;try{sock=new WebSocket(wsUrl())}catch(e){btns(false);setNet('🔴 Địa chỉ server không hợp lệ','#ff9d9d');return}
 sock.binaryType='arraybuffer';ws=sock;
 sock.onopen=()=>{net.tries=0;sock.send(JSON.stringify({t:'join',v:WR.PROTO,room:S.room,pid:net.pid,name:S.name||'Bạn',bi:S.breed,col:S.col||B[S.breed].c,dif:S.dif,sp:S.mode==='over'?0:1}))};
 sock.onmessage=ev=>{if(typeof ev.data!=='string'){onBin(ev.data);return}let m;try{m=JSON.parse(ev.data)}catch(e){return}onMsg(m)};
 sock.onclose=()=>{if(ws!==sock)return;ws=null;onClose()};sock.onerror=()=>{}}
function onClose(){if(net.leaving)return;
 if(!S.online){btns(false);setNet('🔴 Mất kết nối tới server. Thử lại hoặc chơi offline.','#ff9d9d');return}
 $('conn').classList.remove('hide');
 if(++net.tries>12){toast('Mất kết nối với server');toMenu();return}
 $('conn').textContent=`⚠ Mất kết nối — đang kết nối lại (${net.tries})…`;
 setTimeout(()=>{if(!net.leaving&&S.online&&!ws)openWs()},Math.min(4000,700*net.tries))}
function onMsg(m){switch(m.t){
 case 'welcome':if(m.v!==WR.PROTO){net.leaving=true;btns(false);setNet('🔴 Server đang chạy phiên bản cũ — hãy deploy lại backend (xem README)','#ff9d9d');try{ws.close()}catch(e){}ws=null;return}return onWelcome(m);
 case 'meta':net.meta=m.ents;return;
 case 'pg':{const r=performance.now()-m.c;if(r>=0&&r<5000)net.rtt=net.rtt?net.rtt*.7+r*.3:r;return}
 case 'spawned':return onSpawned(m);
 case 'err':net.leaving=true;btns(false);setNet('🔴 '+(m.msg||'Lỗi'),'#ff9d9d');try{ws.close()}catch(e){}ws=null;return}}
