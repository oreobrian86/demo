<script>
/*RULES-BEGIN*/
/* KHÁNH MIU — LUẬT CHƠI DÙNG CHUNG (server + chế độ offline trong index.html).
 * Mọi thực thể (người chơi, bot) đi qua CÙNG các hàm này: không có nhánh riêng cho "người" hay "AI".
 * Sau khi sửa file này chạy:  node tools/sync-rules.js   (chép bản sao vào index.html; test sẽ kiểm tra khớp).
 * Đơn vị: kg (cân nặng). Cân nặng quyết định bán kính: rad(kg). */
(function (root, factory) { if (typeof module === 'object' && module.exports) module.exports = factory(); else root.KMRules = factory() })(this, function () {
  'use strict';
  const CFG = {
    W: 4200,
    // ----- cân nặng (kg) -----
    SPAWN_KG: 10, MIN_KG: 6, MAX_KG: 250,   // xuất hiện / sàn không thể giảm thấp hơn / trần tăng trưởng
    FOOD_GAIN_K: 1.5, FOOD_GAIN_SOFT: 110,  // tăng = v*K/(1+kg/SOFT): càng nặng ăn càng tăng chậm
    DECAY_ABOVE: 30, DECAY_PER_SEC: .0015,  // trên 30kg hao dần 0.15%/s (chống tăng trưởng vô hạn)
    // ----- nuốt -----
    SWALLOW_WEIGHT_RATIO: 1.6,  // nặng hơn mục tiêu >= 1.6 lần mới nuốt được
    DASH_SWALLOW_RATIO: 1.4,    // khi đang lao (dash) ngưỡng hạ xuống 1.4 lần
    REACH_BODY: .85, REACH_PREY: .15, LUNGE_REACH: .6, // tầm với = ra*(0.85 + 0.6 nếu đang lao) + rb*0.15
    SWALLOW_GAIN: .25,          // nuốt mồi tăng thêm 25% cân nặng mồi (qua công thức ăn)
    SWALLOW_DROP: .55,          // mồi để lại thức ăn tổng trị giá 55% cân nặng
    // ----- tốc độ / chạy nhanh -----
    BASE_SPEED: 215, SPEED_EXP: .1, DASH_MULT: 1.75,
    ENERGY_MAX: 100,            // thanh "thức ăn dự trữ" 0..100
    DASH_DRAIN: 18,             // tiêu hao/giây khi chạy nhanh (cho mèo 10kg; mèo nặng hơn hao chậm hơn)
    DRAIN_KG_EXP: .25,          // drain *= (10/kg)^0.25
    DASH_MIN_START: 12,         // cạn kiệt thì phải hồi lại >= 12 mới chạy nhanh tiếp
    ENERGY_REGEN: 2.5,          // hồi/giây khi KHÔNG chạy nhanh
    ENERGY_PER_V: 2,            // mỗi 1 giá trị thức ăn hồi 2 năng lượng (đủ để kéo dài, không đủ để chạy nhanh vô hạn)
    DASH_BURN_FRAC: .012, DASH_BURN_MIN: .12, // chạy nhanh đốt cân: max(0.12, 1.2%*kg) kg/giây
    // ----- bù độ trễ mạng (server) -----
    LAG_MAX_MS: 300, INTERP_MS: 70
  };
  const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rad = kg => 12 + 3.2 * Math.sqrt(kg);
  const speedOf = (kg, dash) => CFG.BASE_SPEED * Math.pow(rad(kg) / 14, -CFG.SPEED_EXP) * (dash ? CFG.DASH_MULT : 1);
  const newBody = (e, kg) => { e.kg = kg; e.en = CFG.ENERGY_MAX; e.tired = false; e.dashing = false; return e };
  // Chuyển động + chạy nhanh + hao cân + hồi năng lượng cho MỌI thực thể.
  function stepBody(e, dt, ta, wantDash) {
    let da = ta - e.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); e.ang += clamp(da, -6 * dt, 6 * dt);
    const can = wantDash && !e.tired && e.en > 0 && e.kg > CFG.MIN_KG + .5;
    if (can) {
      e.en -= CFG.DASH_DRAIN * Math.pow(CFG.SPAWN_KG / Math.max(e.kg, CFG.SPAWN_KG), CFG.DRAIN_KG_EXP) * dt;
      if (e.en <= 0) { e.en = 0; e.tired = true }
      e.kg = Math.max(CFG.MIN_KG, e.kg - Math.max(CFG.DASH_BURN_MIN, CFG.DASH_BURN_FRAC * e.kg) * dt); e.dashing = true;
    } else { e.dashing = false; restEnergy(e, dt) }
    const sp = speedOf(e.kg, e.dashing);
    e.vx = Math.cos(e.ang) * sp; e.vy = Math.sin(e.ang) * sp; e.x += e.vx * dt; e.y += e.vy * dt;
    const r = rad(e.kg); e.x = clamp(e.x, r, CFG.W - r); e.y = clamp(e.y, r, CFG.W - r);
    if (e.ph !== undefined) e.ph += dt * sp / 22;
    if (e.kg > CFG.DECAY_ABOVE) e.kg -= e.kg * CFG.DECAY_PER_SEC * dt;
  }
  function restEnergy(e, dt) { e.en = Math.min(CFG.ENERGY_MAX, e.en + CFG.ENERGY_REGEN * dt); if (e.tired && e.en >= CFG.DASH_MIN_START) e.tired = false }
  // Ăn thức ăn giá trị v: tăng cân (có trần) + hồi năng lượng. Trả về số kg tăng thực tế.
  function feed(e, v) {
    const old = e.kg; e.kg = Math.min(CFG.MAX_KG, e.kg + v * CFG.FOOD_GAIN_K / (1 + e.kg / CFG.FOOD_GAIN_SOFT));
    e.en = Math.min(CFG.ENERGY_MAX, e.en + v * CFG.ENERGY_PER_V); if (e.tired && e.en >= CFG.DASH_MIN_START) e.tired = false; return e.kg - old;
  }
  const canSwallow = (a, b) => a.kg >= b.kg * (a.dashing ? CFG.DASH_SWALLOW_RATIO : CFG.SWALLOW_WEIGHT_RATIO);
  const reachOf = (a, bKg) => rad(a.kg) * (CFG.REACH_BODY + (a.dashing ? CFG.LUNGE_REACH : 0)) + rad(bKg) * CFG.REACH_PREY;
  // Tìm các vụ nuốt hợp lệ trong 1 tick. posOf(a,b) cho phép server "tua lại" vị trí mục tiêu (bù trễ); mặc định vị trí hiện tại.
  // Mỗi mồi chỉ có tối đa 1 kẻ săn (kẻ ăn sâu nhất, hoà thì nặng hơn) => không thể 2 kẻ cùng nuốt 1 mục tiêu.
  function findSwallows(list, posOf) {
    const best = new Map();
    for (const a of list) {
      if (!a.alive) continue;
      for (const b of list) {
        if (a === b || !b.alive || !canSwallow(a, b)) continue;
        const p = posOf ? posOf(a, b) : b, rc = reachOf(a, b.kg), d = Math.hypot(a.x - p.x, a.y - p.y);
        if (d > rc) continue;
        const depth = d / rc, cur = best.get(b);
        if (!cur || depth < cur.depth || (depth === cur.depth && a.kg > cur.a.kg)) best.set(b, { a, b, depth });
      }
    }
    return [...best.values()].sort((x, y) => y.a.kg - x.a.kg || x.depth - y.depth).map(x => [x.a, x.b]);
  }
  // Thực hiện vụ nuốt (mutate). Trả về {gain, preyKg}. Người gọi lo hiệu ứng/thức ăn rơi.
  function applySwallow(a, b) { const preyKg = b.kg; b.alive = false; const gain = feed(a, preyKg * CFG.SWALLOW_GAIN); a.kills = (a.kills || 0) + 1; return { gain, preyKg } }
  const dropPlan = kg => { const n = Math.min(45, Math.max(4, kg / 2.2 | 0)); return { n, v: kg * CFG.SWALLOW_DROP / n + .4 } };
  // AI bot (dùng chung server + offline). lists = [danh sách thức ăn, thức ăn rơi, pate]; mục nào có a===false thì bỏ qua.
  // Bot dùng CÙNG ngưỡng nuốt với luật chiến đấu; chỉ chạy nhanh khi còn năng lượng (cùng luật với người chơi).
  function think(b, dt, list, lists) {
    const a = b.ai; a.t -= dt; if (a.t > 0) return; a.t = .25 + Math.random() * .25;
    const r = rad(b.kg), W = CFG.W; let thr = null, prey = null, td = 520, pd = 420;
    for (const o of list) {
      if (o === b) continue;
      const d = Math.hypot(o.x - b.x, o.y - b.y);
      if (o.kg >= b.kg * CFG.SWALLOW_WEIGHT_RATIO * .85 && d < td) { thr = o; td = d } else if (canSwallow({ kg: b.kg, dashing: false }, o) && d < pd) { prey = o; pd = d }
    }
    a.dsh = false;
    if (thr) { a.flee = true; a.tx = b.x - (thr.x - b.x); a.ty = b.y - (thr.y - b.y); a.dsh = td < r * 3.5 && !b.tired && b.en > 25; return }
    a.flee = false;
    if (prey) { a.tx = prey.x + (prey.vx || 0) * .3; a.ty = prey.y + (prey.vy || 0) * .3; a.dsh = pd < r * 4 && !b.tired && b.en > 40; return }
    let bd = 700, bf = null;
    for (const L of lists) for (const f of L) { if (f.a === false) continue; const d = Math.abs(f.x - b.x) + Math.abs(f.y - b.y); if (d < bd) { bd = d; bf = f } }
    if (bf) { a.tx = bf.x; a.ty = bf.y } else if (Math.hypot(a.tx - b.x, a.ty - b.y) < 80 || !a.tx) { a.tx = 200 + Math.random() * (W - 400); a.ty = 200 + Math.random() * (W - 400) }
  }
  return { CFG, think, TAU, clamp, rad, speedOf, newBody, stepBody, restEnergy, feed, canSwallow, reachOf, findSwallows, applySwallow, dropPlan };
});
/*RULES-END*/
</script>
<script>
"use strict";
const $=id=>document.getElementById(id),cv=$('g'),g=cv.getContext('2d'),mm=$('mm'),mg=mm.getContext('2d');
const W=4200,NF=650,TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const B=[{n:'Mướp',c:'#b98a5a',e:0,p:1},{n:'Cam',c:'#f29a3c',e:0,p:1},{n:'Đen',c:'#2e2e38',e:0,p:0},{n:'Trắng',c:'#f6f3f0',e:2,p:0},{n:'Tam thể',c:'#f6f3f0',e:0,p:2},{n:'Tuxedo',c:'#26262e',e:0,p:3},{n:'Xiêm',c:'#eadcc2',e:3,p:4},{n:'Ba Tư',c:'#d9d4e8',e:1,p:0,f:1},{n:'Anh lông ngắn',c:'#8fa0b5',e:1,p:0,w:1.12},{n:'Bengal',c:'#dba444',e:1,p:5}];
const NAMES=['Miu','Bông','Tom','Mun','Kitty','Lulu','Cốm','Tuna','Nabi','Mochi','Sushi','Bơ','Gấu','Xíu'];
// ---------- audio ----------
let AC=null,sfxOn=true,musOn=true,lastS={},mTimer=null,mStep=0,vol={m:1,s:1},BUS={};
function loadAud(){try{const j=JSON.parse(localStorage.getItem('khanhmiu.audio')||'{}');if(typeof j.mu==='boolean')musOn=j.mu;if(typeof j.sf==='boolean')sfxOn=j.sf;if(isFinite(j.vm))vol.m=clamp(j.vm,0,1);if(isFinite(j.vs))vol.s=clamp(j.vs,0,1)}catch(e){}}
function saveAud(){try{localStorage.setItem('khanhmiu.audio',JSON.stringify({mu:musOn,sf:sfxOn,vm:vol.m,vs:vol.s}))}catch(e){}}

function srvBase(){const q=new URLSearchParams(location.search).get('server');if(q)return q.replace(/\/+$/,'');if(CFG.server)return CFG.server.replace(/\/+$/,'');if(/^https?:$/.test(location.protocol)&&!/\.github\.io$/.test(location.hostname))return location.origin;return''}
const wsUrl=()=>srvBase().replace(/^http/,'ws'),httpUrl=()=>srvBase().replace(/^ws/,'http');
function getPid(){let p='';try{p=sessionStorage.getItem('km.pid')||''}catch(e){}if(!/^[a-f0-9]{24}$/.test(p)){p=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');try{sessionStorage.setItem('km.pid',p)}catch(e){}}return p}
const cleanRoom=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
const curRoom=()=>cleanRoom($('rm').value)||DEFAULT_ROOM;
function newCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>a[b%a.length]).join('')}
function inviteLink(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',S.room);const sv=new URLSearchParams(location.search).get('server');if(sv)u.searchParams.set('server',sv);return u.toString()}
function setNet(t,c){const e=$('net');e.textContent=t;e.style.color=c||'#9fe3a8'}
function btns(dis){['play','rj','rn'].forEach(i=>$(i).disabled=dis)}
async function initMenuNet(){const q=cleanRoom(new URLSearchParams(location.search).get('room'));if(q&&!$('rm').value)$('rm').value=q;
 if(!srvBase()){setNet('⚪ Chưa cấu hình server multiplayer — chỉ chơi offline được.','#c9d3df');return}
 setNet('🟡 Đang kiểm tra server…','#ffd27a');
 try{const c=new AbortController(),to=setTimeout(()=>c.abort(),5000);const r=await fetch(httpUrl()+'/health',{signal:c.signal,cache:'no-store'});clearTimeout(to);const j=await r.json();setNet(`🟢 Server online · ${j.players} người đang chơi`+(q?` · phòng ${q}`:''))}
 catch(e){setNet('🟡 Server đang ngủ — bấm START để đánh thức (khoảng 1 phút, chỉ lần đầu)','#ffd27a');fetch(httpUrl()+'/health',{mode:'no-cors'}).catch(()=>{})}}
async function wake(tok){const u=httpUrl()+'/health',t0=Date.now();let first=true;while(Date.now()-t0<80000&&tok===wakeTok){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),7000);const r=await fetch(u,{signal:c.signal,cache:'no-store'});clearTimeout(to);if(r.ok)return true}catch(e){}if(first){first=false;setNet('🟡 Server đang thức dậy… có thể mất tới 1 phút','#ffd27a')}await new Promise(r=>setTimeout(r,1500))}return false}
async function playOnline(room){S.name=$('nm').value.trim();ac();
 if(!srvBase()){startGame();return}
 S.room=room;$('rm').value=room===DEFAULT_ROOM?'':room;try{const u=new URL(location.href);u.searchParams.set('room',room);history.replaceState(null,'',u)}catch(e){}
 const tok=++wakeTok;btns(true);setNet(`🟡 Đang kết nối phòng ${room}…`,'#ffd27a');
 const ok=await wake(tok);if(tok!==wakeTok)return;
 if(!ok){btns(false);setNet('🔴 Không kết nối được server. Thử lại hoặc chơi offline.','#ff9d9d');return}
 net.leaving=false;net.tries=0;net.pid=getPid();openWs()}
function openWs(){let sock;try{sock=new WebSocket(wsUrl())}catch(e){btns(false);setNet('🔴 Địa chỉ server không hợp lệ','#ff9d9d');return}
 ws=sock;
 sock.onopen=()=>{net.tries=0;sock.send(JSON.stringify({t:'join',v:2,room:S.room,pid:net.pid,name:S.name||'Bạn',bi:S.breed,col:S.col||B[S.breed].c,sp:S.mode==='over'?0:1}))};
 sock.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onMsg(m)};
 sock.onclose=()=>{if(ws!==sock)return;ws=null;onClose()};sock.onerror=()=>{}}
function onClose(){if(net.leaving)return;
 if(!S.online){btns(false);setNet('🔴 Mất kết nối tới server. Thử lại hoặc chơi offline.','#ff9d9d');return}
 $('conn').classList.remove('hide');
 if(++net.tries>12){toast('Mất kết nối với server');toMenu();return}
 $('conn').textContent=`⚠ Mất kết nối — đang kết nối lại (${net.tries})…`;
 setTimeout(()=>{if(!net.leaving&&S.online&&!ws)openWs()},Math.min(4000,700*net.tries))}
function onMsg(m){switch(m.t){
 case 'welcome':if(m.v!==2){net.leaving=true;btns(false);setNet('🔴 Server đang chạy phiên bản cũ — hãy deploy lại backend (xem README)','#ff9d9d');try{ws.close()}catch(e){}ws=null;return}return onWelcome(m);
 case 'meta':net.meta=m.ents;return;
 case 's':if(S.online)onSnap(m);return;
 case 'spawned':return onSpawned(m);
 case 'err':net.leaving=true;btns(false);setNet('🔴 '+(m.msg||'Lỗi'),'#ff9d9d');try{ws.close()}catch(e){}ws=null;return}}
const newMe=y=>{net.traj.length=0;return{x:y[0],y:y[1],kg:y[2],en:y[3],tired:false,ang:rnd(0,TAU),vx:0,vy:0,bi:S.breed,col:S.col||B[S.breed].c,name:S.name||'Bạn',bot:false,alive:true,kills:0,ph:0,dashing:false,id:net.id,bl:0,peak:y[2]}};
function onWelcome(m){net.id=m.id;net.meta=m.meta;S.room=m.room;
 food.length=0;const f=m.food;for(let i=0;i<f.length;i+=4)food.push({x:f[i],y:f[i+1],v:f[i+2],h:f[i+3],a:true,t:0});for(const i of m.off)if(food[i])food[i].a=false;
 drops=m.drops.map(d=>({id:d[0],x:d[1],y:d[2],v:d[3],h:d[4],l:60}));pates=m.pates.map(p=>({id:p[0],x:p[1],y:p[2]}));
 peers={};bots=[];parts=[];rings=[];S.online=true;net.tries=0;$('conn').classList.add('hide');btns(false);
 if(m.you){me=newMe(m.you);cam.x=me.x;cam.y=me.y;if(S.mode!=='play'&&S.mode!=='over')showPlayUI()}
 toast(`🏠 Phòng ${m.room} · ${m.n} người chơi · gửi link cho bạn bè!`)}
function onSpawned(m){me=newMe(m.you);cam.x=me.x;cam.y=me.y;S.paused=false;showPlayUI()}
function respawnOnline(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'spawn',name:S.name||'Bạn',bi:S.breed,col:S.col||B[S.breed].c}));else toast('Đang kết nối lại…')}
function reconcile(sm,ak){const sx=sm[1],sy=sm[2],T=ak[1]+ak[2],tr=net.traj;let px=null,py=null;
 if(ak[1]>0&&tr.length>1&&T>=tr[0].t&&T<=tr[tr.length-1].t){let i=tr.length-1;while(i>0&&tr[i-1].t>T)i--;const a=tr[Math.max(0,i-1)],b=tr[i],f=b.t>a.t?(T-a.t)/(b.t-a.t):0;px=a.x+(b.x-a.x)*f;py=a.y+(b.y-a.y)*f}
 if(px===null){if(Math.hypot(sx-me.x,sy-me.y)>300){me.x=sx;me.y=sy;tr.length=0}return}
 const dx=sx-px,dy=sy-py,d=Math.hypot(dx,dy); // so với vị trí CỦA CHÍNH MÌNH tại thời điểm server xử lý input => không còn lệch do độ trễ
 if(d>250){me.x=sx;me.y=sy;tr.length=0}else if(d>12){const k=(d-12)*.35/d;me.x+=dx*k;me.y+=dy*k;for(const p of tr){p.x+=dx*k;p.y+=dy*k}}}
function onSnap(m){const seen={};let sm=null;
 for(const a of m.p){const id=a[0];
  if(id===net.id){if(me&&me.alive){me.kg=a[3];me.kills=a[6];sm=a}continue}
  const mt=net.meta[id];if(!mt)continue;
  let o=peers[id];if(!o)o=peers[id]={id,x:a[1],y:a[2],vx:0,vy:0,ph:0,bl:0,alive:true};
  o.tx=a[1];o.ty=a[2];o.kg=a[3];o.ang=a[4];o.dashing=!!a[5];o.kills=a[6];o.name=mt[0];o.bi=mt[1];o.col=mt[2];o.bot=!!mt[3];o.peer=mt[3]?0:id;seen[id]=1}
 for(const ev of m.e)onEv(ev); // xử lý sự kiện TRƯỚC khi xoá mèo vắng mặt: sự kiện nuốt cần tên/màu/vị trí của nạn nhân
 for(const k in peers)if(!seen[k])delete peers[k];
 for(const ak of m.k)if(ak[0]===net.id&&me&&me.alive&&sm){me.en=ak[3];me.tired=!!ak[4];reconcile(sm,ak)}}
const feedGain=v=>me?RL.feed({kg:me.kg,en:0,tired:false},v):0;
function onEv(ev){switch(ev[0]){
 case 'f-':{const f=food[ev[1]];if(f){f.a=false;if(ev[2]===net.id&&me){sfx('eat');burst(f.x,f.y,3,`hsl(${f.h},90%,65%)`,60);gainFx(feedGain(f.v))}}break}
 case 'f+':if(food[ev[1]])food[ev[1]].a=true;break;
 case 'd+':drops.push({id:ev[1],x:ev[2],y:ev[3],v:ev[4],h:ev[5],l:60});break;
 case 'd-':{const i=drops.findIndex(d=>d.id===ev[1]);if(i>=0){if(ev[2]===net.id){sfx('loot');gainFx(feedGain(drops[i].v))}drops.splice(i,1)}break}
 case 'p+':pates.push({id:ev[1],x:ev[2],y:ev[3]});break;
 case 'p-':{const i=pates.findIndex(p=>p.id===ev[1]);if(i>=0)pates.splice(i,1);if(ev[2]){pateFx(ev[3],ev[4],ev[2]===net.id);if(ev[2]===net.id)gainFx(feedGain(PATE_V))}break}
 case 'k':{const kid=ev[1],vid=ev[2],a=kid===net.id?me:peers[kid],v=vid===net.id?me:peers[vid]||{x:ev[3],y:ev[4],kg:ev[7],col:'#fff',bi:0,name:'?'};
  swallowFx(a,v,ev[6]);
  if(vid===net.id){if(me&&me.alive){me.alive=false;shake=14;sfx('die');closeSettings();setTimeout(gameOver,900,{name:ev[5]})}}else delete peers[vid];break}
 case 'j':if(ev[2]!==net.id)toast((ev[1]||'Một mèo')+' vừa vào đấu trường! 🐾');break;
 case 'l':toast((ev[1]||'Một mèo')+' đã rời phòng');break}}
function smoothPeers(dt){const k=Math.min(1,dt*14);for(const id in peers){const o=peers[id],sp=215*Math.pow(rad(o.kg)/14,-.22)*(o.dashing?1.75:1),mv=Math.hypot(o.tx-o.x,o.ty-o.y)>1.5;o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k;o.vx=Math.cos(o.ang)*sp;o.vy=Math.sin(o.ang)*sp;if(mv)o.ph+=dt*sp/22;o.bl=Math.random()<.004?.15:Math.max(0,o.bl-dt)}}
function sendIn(a,d,i,c){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'in',a:+a.toFixed(3),d:d?1:0,i:i?1:0,c:Math.round(c||performance.now())}))}
function netTick(dt,now,ta,dsh){const live=ws&&ws.readyState===1;
 if(!S.paused&&live){move(me,dt,ta,dsh);const tr=net.traj;tr.push({t:now,x:me.x,y:me.y});while(tr.length>2&&tr[0].t<now-2500)tr.shift()}
 if(now-net.lastSend>50){net.lastSend=now;sendIn(S.paused?me.ang:ta,S.paused?0:dsh,S.paused,now)}}
function netLeave(){net.leaving=true;if(ws){const s=ws;ws=null;try{s.send(JSON.stringify({t:'leave'}))}catch(e){}try{s.close()}catch(e){}}}
function toMenu(){sfx('click');$('toast').style.opacity=0;const was=S.online;if(was)netLeave();wakeTok++;S.online=false;S.paused=false;S.mode='menu';me=null;peers={};drops=[];pates=[];rings=[];ghosts=[];floats=[];genFood();
 if(was){bots=[];for(let i=0;i<7;i++)bots.push(mk(true,NAMES[i]))}
 ['go','st','conn'].forEach(i=>$(i).classList.add('hide'));$('menu').classList.remove('hide');['hud','lb','mm','snd','dash','gear'].forEach(i=>$(i).classList.add('hide'));btns(false);initMenuNet()}

let last=performance.now(),stepT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(S.paused&&!S.online&&S.mode==='play'){draw();requestAnimationFrame(frame);return}S.t+=dt;if(S.online)smoothPeers(dt);
 if(S.mode==='play'&&me&&me.alive){let ta=me.ang;const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(kx||ky){ta=Math.atan2(ky,kx);mouse.has=false}else if(mouse.has)ta=Math.atan2(mouse.y-innerHeight/2,mouse.x-innerWidth/2);
  const dsh=keys[' ']||keys.dash||mouse.down;if(S.online)netTick(dt,now,ta,dsh);else{move(me,dt,ta,dsh);eatStuff(me)}stepT+=dt;if(stepT>.28){stepT=0;if(!S.paused)sfx('step')}
  if(dsh&&!me.tired&&me.en>0&&!me._d)sfx('atk');if(dsh&&me.tired&&now-(S.tt||0)>1800){S.tt=now;sfx('nope');toast('🍗 Hết thức ăn dự trữ! Ăn thêm để chạy nhanh')}me._d=dsh;me.peak=Math.max(me.peak||0,me.kg);
  bots.forEach(b=>{if(!b.alive)return;think(b,dt);const m=Math.hypot(b.x-b.ai.tx,b.y-b.ai.ty);let ta2=Math.atan2(b.ai.ty-b.y,b.ai.tx-b.x);const r=rad(b.kg);if(b.x<r+120||b.x>W-r-120||b.y<r+120||b.y>W-r-120)ta2=Math.atan2(W/2-b.y,W/2-b.x);move(b,dt,ta2,b.ai.dsh);eatStuff(b)});
  if(!S.online){fight();respawnBots(dt);offlinePate(dt);food.forEach(f=>{if(!f.a&&S.t>f.t)f.a=true});for(let i=drops.length-1;i>=0;i--){drops[i].l-=dt;if(drops[i].l<=0)drops.splice(i,1)}}
  cam.x+=(me.x-cam.x)*Math.min(1,dt*8);cam.y+=(me.y-cam.y)*Math.min(1,dt*8);const tz=clamp(1.2-Math.sqrt(rad(me.dk||me.kg))*.055,.42,1.1);cam.z+=(tz-cam.z)*Math.min(1,dt*2);
